---
- name: Validate DBCS DB Precheck Results
  hosts: DBCS
  gather_facts: false

  collections:
    - oracle.oci

  vars_files:
    - "config/{{ instance }}.yaml"

  vars:
    target: "{{ group1 }}"
    target_region: "{{ region1 }}"
    target_patch_version: "{{ db_patch_version | default('23.26.3.0.0') }}"

  tasks:

    - name: Ensure target is a list of hosts
      ansible.builtin.set_fact:
        target_list: "{{ groups[target] if target in groups else [target] }}"

    - name: Fetch DB home details
      oracle.oci.oci_database_db_home_facts:
        compartment_id: "{{ hostvars[item].compartment_id }}"
        db_system_id: "{{ hostvars[item].db_system_id }}"
        region: "{{ hostvars[item].region | default(target_region) }}"
      loop: "{{ target_list }}"
      register: db_home_details

    - name: Fetch patch inventory for each DB home
      oracle.oci.oci_database_db_home_patch_facts:
        db_home_id: "{{ item.db_homes[0].id }}"
        region: "{{ hostvars[item.item].region | default(target_region) }}"
      loop: "{{ db_home_details.results }}"
      register: db_home_patch_details
      when:
        - item.db_homes is defined
        - item.db_homes | length > 0

    - name: Find target patch ID from OCI patch inventory
      ansible.builtin.set_fact:
        target_patch_id: >-
          {{
            (db_home_patch_details.results
             | selectattr('db_home_patches', 'defined')
             | map(attribute='db_home_patches')
             | flatten
             | selectattr('version', 'equalto', target_patch_version)
             | list | first).id
          }}
      when:
        - db_home_patch_details is defined
        - db_home_patch_details.results is defined

    - name: Stop if target patch is not found
      ansible.builtin.assert:
        that:
          - target_patch_id is defined
        fail_msg: >-
          Target patch {{ target_patch_version }} was not found in OCI.
          DB precheck validation cannot continue.

    - name: Fetch DB home patch history for validation
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ item.item.db_homes[0].id }}"
        region: "{{ hostvars[item.item.item].region | default(target_region) }}"
        sort_by: TIMESTARTED
        sort_order: DESC
      loop: "{{ db_home_patch_details.results }}"
      register: db_precheck_history
      when:
        - item.db_home_patches is defined
        - item.db_home_patches | length > 0

    - name: Identify PRECHECK entries for the target patch
      ansible.builtin.set_fact:
        precheck_entries: >-
          {{
            db_precheck_history.results
            | selectattr('db_home_patch_history_entries', 'defined')
            | map(attribute='db_home_patch_history_entries')
            | flatten
            | selectattr('patch_id', 'equalto', target_patch_id)
            | selectattr('action', 'equalto', 'PRECHECK')
            | list
          }}
      when:
        - db_precheck_history is defined

    - name: Detect latest PRECHECK status
      ansible.builtin.set_fact:
        latest_precheck: >-
          {{
            precheck_entries
            | sort(attribute='time_started')
            | last
          }}
      when:
        - precheck_entries is defined
        - precheck_entries | length > 0

    - name: Summarize precheck validation results
      ansible.builtin.debug:
        msg:
          - "Target Patch Version: {{ target_patch_version }}"
          - "Target Patch ID: {{ target_patch_id }}"
          - "PRECHECK Entries Count: {{ precheck_entries | default([]) | length }}"
          - "Latest PRECHECK State: {{ latest_precheck.lifecycle_state | default('NOT_FOUND') }}"
          - "Latest PRECHECK Started: {{ latest_precheck.time_started | default('N/A') }}"
          - "Latest PRECHECK Ended: {{ latest_precheck.time_ended | default('N/A') }}"
      when:
        - precheck_entries is defined

    - name: Validate DB precheck readiness to proceed
      ansible.builtin.assert:
        that:
          - precheck_entries is defined
          - precheck_entries | length > 0
          - (precheck_entries | selectattr('lifecycle_state', 'equalto', 'SUCCEEDED') | list | length) > 0
        fail_msg: >-
          DB precheck failed validation.
          No successful PRECHECK result was found for patch {{ target_patch_version }}.
          Failures or exceptions detected.
          Readiness to proceed: NO.
        success_msg: >-
          DB precheck validation passed.
          At least one successful PRECHECK result was found for patch {{ target_patch_version }}.
          Readiness to proceed: YES.
