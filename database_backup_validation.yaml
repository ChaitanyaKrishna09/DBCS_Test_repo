---
# Validate that a recent, successful database backup is available before patching.
# Example:
#   ansible-playbook -i inventory database_backup_validation.yml \
#     -e backup_validation_hosts=dbservers \
#     -e backup_validation_oracle_sid=ORCL
- name: Validate latest successful database backup
  hosts: "{{ backup_validation_hosts | default('DBCS') }}"
  gather_facts: false
  become: true
  vars_files:
    - config/DB0609.yaml
  pre_tasks:
    - name: Load invalid object validation defaults
      ansible.builtin.include_vars: roles/Invalid_count/defaults/Invalid_validations.yaml
    - name: Run invalid object validation
      ansible.builtin.include_tasks: roles/Invalid_count/tasks/Invalid_validations.yaml
    - name: Compile invalid database objects
      ansible.builtin.include_tasks: roles/Invalid_count/tasks/compile_invalids.yaml
  roles:
    - role: backup_validation
