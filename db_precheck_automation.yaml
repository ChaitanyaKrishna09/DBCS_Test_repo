---
- name: OCI DB Home patch precheck
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - oracle.oci

  vars:
    region1: "{{ region1 | default('us-ashburn-1') }}"
    db_home_id: "{{ db_home_id | default('') }}"
    patch_id: "{{ patch_id | default('') }}"
    patch_version: "{{ patch_version | default('') }}"
    precheck_poll_interval: "{{ precheck_poll_interval | default(30) }}"
    precheck_timeout_minutes: "{{ precheck_timeout_minutes | default(30) }}"

  tasks:
    - name: Validate required OCI inputs
      ansible.builtin.assert:
        that:
          - db_home_id is defined
          - db_home_id | length > 0
          - region1 is defined
          - region1 | length > 0
          - (patch_id is defined and patch_id | length > 0) or (patch_version is defined and patch_version | length > 0)
        fail_msg: >-
          Required OCI values are missing.
          Provide db_home_id, region1, and either patch_id or patch_version from the OCI Console.

    - name: Resolve patch OCID from version if version only was supplied
      when: patch_id | length == 0 and patch_version | length > 0
      block:
        - name: Get available patches for the DB Home
          oracle.oci.oci_database_db_home_patch_facts:
            db_home_id: "{{ db_home_id }}"
            region: "{{ region1 }}"
          register: patch_facts

        - name: Select target patch by version
          ansible.builtin.set_fact:
            patch_id: >-
              {{
                patch_facts.db_home_patches
                | default([])
                | selectattr('version', 'equalto', patch_version)
                | map(attribute='id')
                | list
                | first
                | default('')
              }}

        - name: Validate patch version resolved to an ID
          ansible.builtin.assert:
            that:
              - patch_id is defined
              - patch_id | length > 0
            fail_msg: >-
              No patch was found for version '{{ patch_version }}' in DB home '{{ db_home_id }}'.

    - name: Fetch latest DB Home patch history
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ db_home_id }}"
        region: "{{ region1 }}"
      register: patch_history

    - name: Find PRECHECK entries for this patch
      ansible.builtin.set_fact:
        precheck_matches: >-
          {{
            patch_history.db_home_patch_history_entries | default([])
            | selectattr('patch_id', 'equalto', patch_id)
            | selectattr('action', 'equalto', 'PRECHECK')
            | list
          }}

    - name: Select the latest PRECHECK result
      ansible.builtin.set_fact:
        latest_precheck: >-
          {{
            precheck_matches
            | sort(attribute='time_started')
            | last
          }}
      when:
        - precheck_matches is defined
        - precheck_matches | length > 0

    - name: Trigger a fresh PRECHECK if none exists or last result was not successful
      oracle.oci.oci_database_db_home:
        db_home_id: "{{ db_home_id }}"
        patch_details:
          patch_id: "{{ patch_id }}"
          action: PRECHECK
        region: "{{ region1 }}"
      register: precheck_trigger
      when:
        - latest_precheck is not defined or latest_precheck.lifecycle_state != 'SUCCEEDED'

    - name: Poll for PRECHECK completion
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ db_home_id }}"
        region: "{{ region1 }}"
      register: precheck_status
      until:
        - precheck_status.db_home_patch_history_entries is defined
        - precheck_status.db_home_patch_history_entries | default([])
          | selectattr('patch_id', 'equalto', patch_id)
          | selectattr('action', 'equalto', 'PRECHECK')
          | list | length > 0
        - (
            precheck_status.db_home_patch_history_entries | default([])
            | selectattr('patch_id', 'equalto', patch_id)
            | selectattr('action', 'equalto', 'PRECHECK')
            | sort(attribute='time_started')
            | last
          ).lifecycle_state in ['SUCCEEDED', 'FAILED', 'REJECTED', 'NEEDS_ATTENTION']
      retries: "{{ (precheck_timeout_minutes | int * 60 / precheck_poll_interval | int) | int }}"
      delay: "{{ precheck_poll_interval | int }}"
      when:
        - latest_precheck is not defined or latest_precheck.lifecycle_state != 'SUCCEEDED'

    - name: Choose final PRECHECK result
      ansible.builtin.set_fact:
        final_precheck: >-
          {{
            (
              precheck_status.db_home_patch_history_entries | default([])
              | selectattr('patch_id', 'equalto', patch_id)
              | selectattr('action', 'equalto', 'PRECHECK')
              | sort(attribute='time_started')
              | last
            )
            if precheck_status is defined and precheck_status.db_home_patch_history_entries is defined
            else latest_precheck
          }}

    - name: Display final PRECHECK result
      ansible.builtin.debug:
        msg:
          - "DB Home ID: {{ db_home_id }}"
          - "Patch ID: {{ patch_id }}"
          - "Patch State: {{ final_precheck.lifecycle_state | default('NOT_FOUND') }}"
          - "Started: {{ final_precheck.time_started | default('N/A') }}"
          - "Ended: {{ final_precheck.time_ended | default('N/A') }}"
          - "Status: {{ final_precheck.status | default('N/A') }}"

    - name: Validate DB precheck readiness
      ansible.builtin.assert:
        that:
          - final_precheck is defined
          - final_precheck.lifecycle_state == 'SUCCEEDED'
        fail_msg: >-
          OCI DB PRECHECK did not pass.
          DB Home: {{ db_home_id }}
          Patch: {{ patch_id }}
          Final state: {{ final_precheck.lifecycle_state | default('NOT_FOUND') }}
          Status: {{ final_precheck.status | default('N/A') }}
        success_msg: >-
          OCI DB PRECHECK passed for patch {{ patch_id }} on DB Home {{ db_home_id }}.
