---
- name: Automate DBCS DB Prechecks
  hosts: localhost
  gather_facts: false

  collections:
    - oracle.oci

  vars_files:
    - "config/{{ instance }}.yaml"

  vars:
    target: "{{ group1 }}"
    target_region: "{{ region1 }}"
    target_patch_version: "{{ db_patch_version | default('23.26.3.0.0') }}"
    precheck_wait_timeout: "{{ precheck_wait_timeout | default(1800) }}"

  tasks:

    - name: Ensure target is a list of hosts
      ansible.builtin.set_fact:
        target_list: "{{ groups[target] if target in groups else [target] }}"

    - name: Display target DB systems
      ansible.builtin.debug:
        var: target_list

    - name: Fetch DB home details for target hosts
      oracle.oci.oci_database_db_home_facts:
        compartment_id: "{{ hostvars[item].compartment_id }}"
        db_system_id: "{{ hostvars[item].db_system_id }}"
        region: "{{ hostvars[item].region | default(target_region) }}"
      loop: "{{ target_list }}"
      register: db_home_details

    - name: Fetch available patches for each DB home
      oracle.oci.oci_database_db_home_patch_facts:
        db_home_id: "{{ item.db_homes[0].id }}"
        region: "{{ hostvars[item.item].region | default(target_region) }}"
      loop: "{{ db_home_details.results }}"
      register: db_home_patch_details
      when:
        - item.db_homes is defined
        - item.db_homes | length > 0

    - name: Build target patch match list
      ansible.builtin.set_fact:
        matched_patches: >-
          {{
            db_home_patch_details.results
            | selectattr('db_home_patches', 'defined')
            | map(attribute='db_home_patches')
            | flatten
            | selectattr('version', 'equalto', target_patch_version)
            | list
          }}
      when:
        - db_home_patch_details is defined
        - db_home_patch_details.results is defined

    - name: Stop if patch version is not available in OCI
      ansible.builtin.assert:
        that:
          - matched_patches is defined
          - matched_patches | length > 0
        fail_msg: >-
          Patch version {{ target_patch_version }} is not available in OCI for the target DB home.
          DB precheck cannot proceed.
        success_msg: >-
          Patch version {{ target_patch_version }} is present in OCI and eligible for precheck.

    - name: Display matched patch details
      ansible.builtin.debug:
        msg:
          - "Host: {{ item.item.item }}"
          - "DB Home ID: {{ item.item.db_homes[0].id }}"
          - "Patch Version: {{ target_patch_version }}"
          - "Patch ID: {{ (item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list | first).id }}"
          - "Patch Description: {{ (item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list | first).description | default('N/A') }}"
      loop: "{{ db_home_patch_details.results }}"
      when:
        - item.db_home_patches is defined
        - item.db_home_patches | length > 0
        - (item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list | length) > 0

    - name: Run DB precheck for each matched DB home
      oracle.oci.oci_database_db_home:
        db_home_id: "{{ item.item.db_homes[0].id }}"
        patch_details:
          patch_id: "{{ (item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list | first).id }}"
          action: PRECHECK
        region: "{{ hostvars[item.item.item].region | default(target_region) }}"
        wait: true
        wait_timeout: "{{ precheck_wait_timeout }}"
      loop: "{{ db_home_patch_details.results }}"
      register: db_precheck_run
      when:
        - item.db_home_patches is defined
        - item.db_home_patches | length > 0
        - (item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list | length) > 0

    - name: Show OCI precheck operation result
      ansible.builtin.debug:
        var: db_precheck_run
      when: db_precheck_run is defined

    - name: Fetch DB home patch history after precheck
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ item.item.db_homes[0].id }}"
        region: "{{ hostvars[item.item.item].region | default(target_region) }}"
        sort_by: TIMESTARTED
        sort_order: DESC
      loop: "{{ db_home_patch_details.results }}"
      register: db_precheck_history
      when:
        - item.db_home_patches is defined
        - item.db_home_patches | length > 0
        - (item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list | length) > 0

    - name: Set latest successful PRECHECK summary
      ansible.builtin.set_fact:
        successful_prechecks: >-
          {{
            db_precheck_history.results
            | selectattr('db_home_patch_history_entries', 'defined')
            | map(attribute='db_home_patch_history_entries')
            | flatten
            | selectattr('action', 'equalto', 'PRECHECK')
            | selectattr('patch_id', 'equalto', (matched_patches | first).id)
            | selectattr('lifecycle_state', 'equalto', 'SUCCEEDED')
            | list
          }}
      when:
        - matched_patches is defined
        - matched_patches | length > 0

    - name: Show precheck history summary
      ansible.builtin.debug:
        msg:
          - "Matched patch ID: {{ (matched_patches | first).id }}"
          - "Successful PRECHECK entries: {{ successful_prechecks | default([]) | length }}"
      when:
        - matched_patches is defined

    - name: Validate DB PRECHECK completion status
      ansible.builtin.assert:
        that:
          - successful_prechecks is defined
          - successful_prechecks | length > 0
        fail_msg: >-
          DB PRECHECK is not successful for patch {{ target_patch_version }}.
          No SUCCEEDED PRECHECK history was found for the target patch.
          Readiness to proceed is NOT approved.
        success_msg: >-
          DB PRECHECK completed successfully for patch {{ target_patch_version }}.
          The database is ready for the next patching stage.
