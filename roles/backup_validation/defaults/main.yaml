---
backup_validation_oracle_home: "{{ ansible_env.ORACLE_HOME | default('/u01/app/oracle/product/19.0.0/dbhome_1') }}"
backup_validation_oracle_sid: "{{ ansible_env.ORACLE_SID | default('DB0609') }}"
backup_validation_connect_string: "/ as sysdba"
backup_validation_sqlplus_bin: "{{ backup_validation_oracle_home }}/bin/sqlplus"
backup_validation_rman_bin: "{{ backup_validation_oracle_home }}/bin/rman"
backup_validation_sqlplus_connect_string: "/ as sysdba"
backup_validation_rman_target_string: "/"

# Keep this overridable for environments with an agreed RMAN command set.
backup_validation_rman_command: |-
  list backup summary;
  exit;
