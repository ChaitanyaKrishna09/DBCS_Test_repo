---
- name: Validate patch approval inputs
  ansible.builtin.include_tasks: validate_inputs.yml

- name: Supersede any existing active approval for this DB Home
  ansible.builtin.include_tasks: supersede_existing_approval.yml
  when: patch_approval_decision == 'APPROVED'

- name: Build and persist patch approval record
  ansible.builtin.include_tasks: persist_approval.yml

- name: Generate report and publish approval statistics
  ansible.builtin.include_tasks: generate_report.yml
