---
- name: DB Home Patch Precheck
  hosts: localhost
  gather_facts: false

  collections:
    - oracle.oci
    - community.general

  vars_files:
    - "config/{{ instance }}.yaml"

  vars:
    target: "{{ group1 }}"
    target_region: "{{ region1 }}"
    target_patch_version: "23.26.3.0.0"
    target_patch_id: ""

  tasks:

    - name: Ensure target is a list of hosts
      ansible.builtin.set_fact:
        target_list: "{{ groups[target] if target in groups else [target] }}"

    - name: Fetch DB Home details
      oracle.oci.oci_database_db_home_facts:
        compartment_id: "{{ hostvars[item].compartment_id }}"
        db_system_id: "{{ hostvars[item].db_system_id }}"
        region: "{{ hostvars[item].region | default(target_region) }}"
      loop: "{{ target_list }}"
      register: db_home_details

    - name: Fetch patches applicable to DB Home
      oracle.oci.oci_database_db_home_patch_facts:
        db_home_id: "{{ item.db_homes[0].id }}"
        region: >-
          {{ hostvars[item.item].region | default(target_region) }}
      loop: "{{ db_home_details.results }}"
      register: db_home_patch_details
      when:
        - item.db_homes is defined
        - item.db_homes | length > 0

    - name: Find target DB Home patch
      ansible.builtin.set_fact:
        target_patch: "{{ item.db_home_patches | selectattr('version', 'equalto', target_patch_version) | list }}"
      loop: "{{ db_home_patch_details.results }}"
      when:
        - item.db_home_patches is defined
        - item.db_home_patches | length > 0

    - name: Set target patch ID from the selected OCI patch
      ansible.builtin.set_fact:
        target_patch_id: "{{ target_patch[0].id }}"
      when:
        - target_patch is defined
        - target_patch | length > 0

    - name: Display target patch details
      ansible.builtin.debug:
        msg:
          - "Target Patch Version: {{ target_patch_version }}"
          - "Patch ID: {{ target_patch[0].id }}"
          - "Patch Description: {{ target_patch[0].description }}"
          - "Available Actions: {{ target_patch[0].available_actions }}"
      when:
        - target_patch is defined
        - target_patch | length > 0

    - name: Fetch database details
      oracle.oci.oci_database_database_facts:
        compartment_id: "{{ hostvars[item.item].compartment_id }}"
        db_home_id: "{{ item.db_homes[0].id }}"
        region: >-
          {{ hostvars[item.item].region | default(target_region) }}
      loop: "{{ db_home_details.results }}"
      register: database_details
      when:
        - item.db_homes is defined
        - item.db_homes | length > 0

    - name: Display database ID
      ansible.builtin.debug:
        msg:
          - "Database ID: {{ item.databases[0].id }}"
          - "Database Name: {{ item.databases[0].db_name }}"
      loop: "{{ database_details.results }}"
      when:
        - item.databases is defined
        - item.databases | length > 0

    - name: Capture DB Home patch history before PRECHECK
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ item.databases[0].db_home_id }}"
        region: "{{ hostvars[item.item.item].region | default(target_region) }}"
      loop: "{{ database_details.results }}"
      register: db_home_patch_history_before
      when:
        - item.databases is defined
        - item.databases | length > 0

    - name: Record existing patch history IDs
      ansible.builtin.set_fact:
        precheck_history_before_ids: >-
          {{
            db_home_patch_history_before.results | default([])
            | selectattr('db_home_patch_history_entries', 'defined')
            | map(attribute='db_home_patch_history_entries')
            | flatten
            | map(attribute='id')
            | list
          }}

    - name: Run DB Home patch precheck
      oracle.oci.oci_database_db_home:
        db_home_id: "{{ item.databases[0].db_home_id }}"
        patch_details:
          patch_id: "{{ target_patch[0].id }}"
          action: PRECHECK
        region: "{{ hostvars[item.item.item].region | default(target_region) }}"
      loop: "{{ database_details.results }}"
      register: db_home_precheck_result
      ignore_errors: true
      when:
        - item.databases is defined
        - item.databases | length > 0
        - target_patch is defined
        - target_patch | length > 0


    - name: Display precheck result
      ansible.builtin.debug:
        var: db_home_precheck_result

    - name: Fetch DB Home patch history
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ item.databases[0].db_home_id }}"
        region: "{{ hostvars[item.item.item].region | default(target_region) }}"
      loop: "{{ database_details.results }}"
      register: db_home_patch_history
      when:
        - item.databases is defined
        - item.databases | length > 0

    - name: Initialize matching PRECHECK entries
      ansible.builtin.set_fact:
        precheck_entries: []
        latest_precheck: {}

    - name: Collect new PRECHECK entries for target patch
      ansible.builtin.set_fact:
        precheck_entries: >-
          {{
            precheck_entries
            + (
                item.db_home_patch_history_entries | default([])
                | selectattr('patch_id', 'equalto', target_patch_id)
                | selectattr('action', 'equalto', 'PRECHECK')
                | rejectattr('id', 'in', precheck_history_before_ids | default([]))
                | list
              )
          }}
      loop: "{{ db_home_patch_history.results | default([]) }}"
      when:
        - item.db_home_patch_history_entries is defined

    - name: Find latest PRECHECK result
      ansible.builtin.set_fact:
        latest_precheck: >-
          {{
            precheck_entries
            | sort(attribute='time_started')
            | last
          }}
      when:
        - precheck_entries | default([]) | length > 0

    - name: Determine whether the current PRECHECK run succeeded
      ansible.builtin.set_fact:
        precheck_run_valid: >-
          {{
            db_home_precheck_result is defined
            and not (db_home_precheck_result.get('skipped', false) | bool)
            and not (db_home_precheck_result.get('failed', false) | bool)
            and (db_home_precheck_result.get('results', []) | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0)
            and (db_home_precheck_result.get('results', []) | selectattr('skipped', 'defined') | selectattr('skipped') | list | length == 0)
            and (precheck_entries | length > 0)
            and (precheck_entries | rejectattr('lifecycle_state', 'equalto', 'SUCCEEDED') | list | length == 0)
          }}

    - name: Display latest PRECHECK result
      ansible.builtin.debug:
        msg:
          - "Target Patch ID: {{ target_patch_id }}"
          - "PRECHECK History ID: {{ latest_precheck.id }}"
          - "PRECHECK Action: {{ latest_precheck.action }}"
          - "PRECHECK State: {{ latest_precheck.lifecycle_state }}"
          - "PRECHECK Started: {{ latest_precheck.time_started }}"
          - "PRECHECK Ended: {{ latest_precheck.time_ended }}"
      when:
        - latest_precheck is defined

    - name: Create precheck report directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/reports"
        state: directory
        mode: "0755"

    - name: Capture one report timestamp
      ansible.builtin.set_fact:
        precheck_report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Set report path from captured timestamp
      ansible.builtin.set_fact:
        precheck_report_file: >-
          {{ playbook_dir }}/reports/db_precheck_{{ target_patch_version }}_{{
          precheck_report_timestamp }}.html

    - name: Generate DB PRECHECK HTML report
      ansible.builtin.template:
        src: templates/database_precheck_report.html.j2
        dest: "{{ precheck_report_file }}"

    - name: Email DB PRECHECK report
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port | int }}"
        from: "{{ email_sender }}"
        to: "{{ email_recipients }}"
        subject: "DB PRECHECK Report - {{ target_patch_version }}"
        subtype: html
        body: "{{ lookup('file', precheck_report_file) }}"
        attach:
          - "{{ precheck_report_file }}"

    - name: Validate DB Home PRECHECK
      ansible.builtin.assert:
        that:
          - precheck_run_valid | bool
        fail_msg: >-
          Current-run DB Home PRECHECK failed, was skipped, or produced no new
          successful history entry for patch {{ target_patch_id }}.
          Current-run history state:
          {{ latest_precheck.lifecycle_state | default('NOT_FOUND') }}.
          Task result:
          {{ db_home_precheck_result.msg | default('No PRECHECK task result was recorded.') }}
        success_msg: >-
          Current-run DB Home PRECHECK succeeded for patch {{ target_patch_id }}.
