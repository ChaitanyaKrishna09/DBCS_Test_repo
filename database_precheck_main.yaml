---
- name: PRECHECK every available patch on every DB Home
  hosts: DBCS
  gather_facts: false

  collections:
    - oracle.oci

  vars:
    target_group: "{{ group1 | default('DBCS') }}"
    target_region: "{{ region1 | default('') }}"
    precheck_wait_timeout: "{{ db_precheck_wait_timeout | default(1800) }}"

  tasks:
    - name: Build target host list
      ansible.builtin.set_fact:
        target_hosts: "{{ groups[target_group] if target_group in groups else [target_group] }}"

    - name: Require target inventory hosts
      ansible.builtin.assert:
        that:
          - target_hosts | length > 0
        fail_msg: "No hosts were found for target group {{ target_group }}."

    - name: Fetch DB Homes from every target DB System
      oracle.oci.oci_database_db_home_facts:
        compartment_id: "{{ hostvars[item].compartment_id }}"
        db_system_id: "{{ hostvars[item].db_system_id }}"
        region: "{{ hostvars[item].region | default(target_region, true) }}"
        config_file_location: "{{ oci_config_file | default(omit) }}"
        config_profile_name: "{{ oci_config_profile | default(omit) }}"
      loop: "{{ target_hosts }}"
      loop_control:
        label: "{{ item }}"
      register: db_home_facts

    - name: Build DB Home target list
      ansible.builtin.set_fact:
        db_home_targets: >-
          {{ (db_home_targets | default([])) + [{
            'db_home_id': item.1.id,
            'region': hostvars[item.0.item].region | default(target_region, true)
          }] }}
      loop: "{{ db_home_facts.results | subelements('db_homes', skip_missing=True) }}"
      loop_control:
        label: "{{ item.1.id }}"

    - name: Deduplicate DB Homes
      ansible.builtin.set_fact:
        unique_db_home_targets: "{{ db_home_targets | default([]) | unique(attribute='db_home_id') | list }}"

    - name: Require discovered DB Homes
      ansible.builtin.assert:
        that:
          - unique_db_home_targets | length > 0
        fail_msg: "No DB Homes were discovered for target group {{ target_group }}."

    - name: Fetch available patches for every DB Home
      oracle.oci.oci_database_db_home_patch_facts:
        db_home_id: "{{ item.db_home_id }}"
        region: "{{ item.region }}"
        config_file_location: "{{ oci_config_file | default(omit) }}"
        config_profile_name: "{{ oci_config_profile | default(omit) }}"
      loop: "{{ unique_db_home_targets }}"
      loop_control:
        label: "{{ item.db_home_id }}"
      register: db_home_patch_facts

    - name: Build all patch targets that support PRECHECK
      ansible.builtin.set_fact:
        precheck_targets: >-
          {{ (precheck_targets | default([])) + [{
            'db_home_id': item.0.item.db_home_id,
            'region': item.0.item.region,
            'patch_id': item.1.id,
            'patch_version': item.1.version | default('N/A'),
            'patch_description': item.1.description | default('N/A')
          }] }}
      loop: "{{ db_home_patch_facts.results | subelements('db_home_patches', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.item.db_home_id }} / {{ item.1.id }}"
      when: "'PRECHECK' in (item.1.available_actions | default([]))"

    - name: Require at least one PRECHECK-eligible patch
      ansible.builtin.assert:
        that:
          - precheck_targets is defined
          - precheck_targets | length > 0
        fail_msg: >-
          OCI returned no patches that support PRECHECK for DB Homes in
          {{ target_group }}.

    - name: Display all selected PRECHECK targets
      ansible.builtin.debug:
        msg:
          - "DB Home ID: {{ item.db_home_id }}"
          - "Patch ID: {{ item.patch_id }}"
          - "Patch Version: {{ item.patch_version }}"
          - "Description: {{ item.patch_description }}"
      loop: "{{ precheck_targets }}"
      loop_control:
        label: "{{ item.db_home_id }} / {{ item.patch_id }}"

    - name: Run PRECHECK for every selected home and patch
      oracle.oci.oci_database_db_home:
        db_home_id: "{{ item.db_home_id }}"
        patch_details:
          patch_id: "{{ item.patch_id }}"
          action: PRECHECK
        region: "{{ item.region }}"
        wait: true
        wait_timeout: "{{ precheck_wait_timeout }}"
        config_file_location: "{{ oci_config_file | default(omit) }}"
        config_profile_name: "{{ oci_config_profile | default(omit) }}"
      loop: "{{ precheck_targets }}"
      loop_control:
        label: "{{ item.db_home_id }} / {{ item.patch_version }} / {{ item.patch_id }}"
      register: db_home_precheck_results

    - name: Show OCI PRECHECK operation results
      ansible.builtin.debug:
        var: db_home_precheck_results.results

    - name: Fetch patch history for every DB Home
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ item.db_home_id }}"
        region: "{{ item.region }}"
        sort_by: TIMESTARTED
        sort_order: DESC
        config_file_location: "{{ oci_config_file | default(omit) }}"
        config_profile_name: "{{ oci_config_profile | default(omit) }}"
      loop: "{{ unique_db_home_targets }}"
      loop_control:
        label: "{{ item.db_home_id }}"
      register: db_home_patch_history

    - name: Build latest PRECHECK validation results for each patch
      ansible.builtin.set_fact:
        precheck_validation_results: >-
          {{ (precheck_validation_results | default([])) + [{
            'db_home_id': item.db_home_id,
            'patch_id': item.patch_id,
            'patch_version': item.patch_version,
            'latest_precheck': (
              db_home_patch_history.results
              | selectattr('item.db_home_id', 'equalto', item.db_home_id)
              | selectattr('db_home_patch_history_entries', 'defined')
              | map(attribute='db_home_patch_history_entries')
              | flatten
              | selectattr('patch_id', 'equalto', item.patch_id)
              | selectattr('action', 'equalto', 'PRECHECK')
              | sort(attribute='time_started')
              | last
              | default({})
            )
          }] }}
      loop: "{{ precheck_targets }}"
      loop_control:
        label: "{{ item.db_home_id }} / {{ item.patch_id }}"

    - name: Display latest PRECHECK state for every home and patch
      ansible.builtin.debug:
        msg: >-
          DB Home {{ item.db_home_id }}, patch {{ item.patch_id }}
          ({{ item.patch_version }}):
          {{ item.latest_precheck.lifecycle_state | default('NOT_FOUND') }}
      loop: "{{ precheck_validation_results }}"
      loop_control:
        label: "{{ item.db_home_id }} / {{ item.patch_id }}"

    - name: Require successful PRECHECK for every home and patch
      ansible.builtin.assert:
        that:
          - item.latest_precheck.id is defined
          - item.latest_precheck.lifecycle_state == 'SUCCEEDED'
        fail_msg: >-
          PRECHECK for DB Home {{ item.db_home_id }}, patch {{ item.patch_id }}
          ({{ item.patch_version }}) did not succeed. Latest state:
          {{ item.latest_precheck.lifecycle_state | default('NOT_FOUND') }}.
        success_msg: >-
          PRECHECK succeeded for DB Home {{ item.db_home_id }},
          patch {{ item.patch_id }} ({{ item.patch_version }}).
      loop: "{{ precheck_validation_results }}"
      loop_control:
        label: "{{ item.db_home_id }} / {{ item.patch_id }}"

        
