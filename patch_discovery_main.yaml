---
- name: Discover OCI DBCS patches for DBA review
  hosts: DBCS
  gather_facts: false
  connection: local

  vars_files:
    - "config/{{ instance }}.yaml"

  collections:
    - oracle.oci

  vars:
    patch_discovery_target_group: "{{ group1 }}"
    patch_discovery_region: "{{ region1 | default('') }}"

  tasks:
    - name: Run patch discovery once for the inventory group
      ansible.builtin.include_role:
        name: patch_discovery
      run_once: true
