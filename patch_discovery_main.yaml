---
- name: Discover OCI DBCS patches for DBA review
  hosts: DBCS
  gather_facts: false
  connection: local

  vars_files:
    - "config/{{ instance }}.yaml"

  collections:
    - oracle.oci
    - community.general

  vars:
    patch_discovery_target_group: "{{ group1 }}"
    patch_discovery_region: "{{ region1 | default('') }}"

  tasks:
    - name: Run patch discovery and notify by email
      run_once: true
      block:
        - name: Run patch discovery once for the inventory group
          ansible.builtin.include_role:
            name: patch_discovery

        - name: Print discovered patch details
          ansible.builtin.debug:
            msg:
              - >-
                DB Home: {{ item.0.db_home.display_name
                | default(item.0.db_home.id) }}
              - "Region: {{ item.0.region }}"
              - "Patch version: {{ item.1.version | default('N/A') }}"
              - "Patch OCID: {{ item.1.id }}"
              - >-
                Description: {{ item.1.description | default('N/A') }}
              - >-
                Available actions: {{ item.1.available_actions
                | default([]) | join(', ') }}
          loop: >-
            {{ patch_discovery_catalog
            | subelements('available_patches', skip_missing=True) }}
          loop_control:
            label: "{{ item.1.version | default(item.1.id) }}"
          when: >-
            patch_discovery_catalog
            | map(attribute='available_patches')
            | map('length')
            | sum > 0

        - name: Report when no patch candidates were discovered
          ansible.builtin.debug:
            msg: >-
              Discovery completed for {{ patch_discovery_target_group }};
              no applicable patch candidates were returned.
          when: >-
            patch_discovery_catalog
            | map(attribute='available_patches')
            | map('length')
            | sum == 0

        - name: Send patch discovery success email
          community.general.mail:
            host: "{{ smtp_server }}"
            port: "{{ smtp_port | int }}"
            from: "{{ email_sender }}"
            to: "{{ email_recipients }}"
            subject: >-
              OCI DBCS Patch Discovery - {{ patch_discovery_target_group }} -
              {{ current_date }}
            subtype: html
            body: |
             <html>
<body style="font-family: Arial, sans-serif;">
  <h3 style="color: #1F4E79;">OCI DBCS Patch Discovery Completed</h3>
  <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; border-color: #BFBFBF; font-size: 14px;">
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">Instance</th>
      <td style="background-color: #F5F9FC;">{{ instance }}</td>
    </tr>
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">Target group</th>
      <td>{{ patch_discovery_target_group }}</td>
    </tr>
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">Region</th>
      <td style="background-color: #F5F9FC;">{{ patch_discovery_region | default('N/A', true) }}</td>
    </tr>
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">DB Homes discovered</th>
      <td>{{ patch_discovery_catalog | length }}</td>
    </tr>
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">Patch candidates</th>
      <td style="background-color: #F5F9FC;">{{ patch_discovery_catalog
        | map(attribute='available_patches')
        | map('length') | sum }}</td>
    </tr>
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">HTML report</th>
      <td>{{ patch_discovery_html_report }}</td>
    </tr>
    <tr>
      <th align="left" style="background-color: #1F4E79; color: #FFFFFF;">JSON report</th>
      <td style="background-color: #F5F9FC;">{{ patch_discovery_json_report }}</td>
    </tr>
  </table>
</body>
</html>
            attach:
              - "{{ patch_discovery_html_report }}"
              - "{{ patch_discovery_json_report }}"
          delegate_to: localhost

      rescue:
        - name: Send patch discovery failure email
          community.general.mail:
            host: "{{ smtp_server }}"
            port: "{{ smtp_port | int }}"
            from: "{{ email_sender }}"
            to: "{{ email_recipients }}"
            subject: >-
              FAILED: OCI DBCS Patch Discovery -
              {{ patch_discovery_target_group }} - {{ current_date }}
            subtype: html
            body: |
              <html><body>
              <h3>OCI DBCS Patch Discovery FAILED</h3>
              <p>Instance: {{ instance }}</p>
              <p>Target group: {{ patch_discovery_target_group }}</p>
              <p>Error: {{ ansible_failed_result.msg
                | default('See job log for details') }}</p>
              </body></html>
          delegate_to: localhost
          ignore_errors: true

        - name: Fail after handling patch discovery error
          ansible.builtin.fail:
            msg: >-
              Patch discovery or success notification failed. Check the job
              log; failure notification was attempted for
              {{ email_recipients | join(', ') }}.
