---
- name: Get DBCS Database Available Patches
  hosts: localhost
  gather_facts: true

  collections:
    - oracle.oci
    - community.general

  vars_files:
    - "config/{{ instance }}.yaml"

  vars:
    target: "{{ group1 }}"
    target_region: "{{ region1 }}"
    report_file: "{{ local_log_file_path }}/db_patch_report.html"

  tasks:

    #################################################################
    # Prepare Target DB Systems
    #################################################################

    - name: Ensure target is a list of hosts
      ansible.builtin.set_fact:
        target_list: "{{ groups[target] if target in groups else [target] }}"

    - name: Debug target list
      ansible.builtin.debug:
        var: target_list

    #################################################################
    # Fetch DB Home Details
    #################################################################

    - name: Fetch DB Home details
      oracle.oci.oci_database_db_home_facts:
        compartment_id: "{{ hostvars[item].compartment_id }}"
        db_system_id: "{{ hostvars[item].db_system_id }}"
        region: "{{ hostvars[item].region | default(target_region) }}"
      loop: "{{ target_list }}"
      register: db_home_details

    #################################################################
    # Fetch Database Available Patches
    #################################################################

    - name: Fetch Database available patches
      oracle.oci.oci_database_db_home_patch_facts:
        db_home_id: "{{ item.db_homes[0].id }}"
        region: "{{ hostvars[item.item].region | default(target_region) }}"
      loop: "{{ db_home_details.results }}"
      register: db_updates
      when:
        - item.db_homes is defined
        - item.db_homes | length > 0

    # 4. NEW - Fetch patch history
    - name: Fetch Database patch history
      oracle.oci.oci_database_db_home_patch_history_entry_facts:
        db_home_id: "{{ item.db_homes[0].id }}"
        region: "{{ hostvars[item.item].region | default(target_region) }}"
      loop: "{{ db_home_details.results }}"
      register: db_patch_history
      when:
        - item.db_homes is defined
        - item.db_homes | length > 0
  
    # 5. Display patch history 
    - name: Display Database patch history
      ansible.builtin.debug:
        var: item
      loop: "{{ db_patch_history.results }}"
      when:
        - not (item.skipped | default(false))
        - not (item.failed | default(false))

    #################################################################
    # Display Database Available Patches
    #################################################################

    - name: Display Database available patches
      ansible.builtin.debug:
        msg:
          - "DB System: {{ item.item.item }}"
          - "DB Home: {{ item.item.db_homes[0].display_name | default('N/A') }}"
          - "Update Description: {{ item.db_home_patches[0].description | default('N/A') }}"
          - "Version: {{ item.db_home_patches[0].version | default('N/A') }}"
          - "Last Action: {{ item.db_home_patches[0].last_action | default('N/A', true) }}"
          - "Release Date: {{ item.db_home_patches[0].time_released | default('N/A') }}"
      loop: "{{ db_updates.results }}"
      when:
        - item.db_home_patches is defined
        - item.db_home_patches | length > 0

    #################################################################
    # Check Configured DB Patch Version
    #################################################################

    - name: Check if configured DB patch is available
      ansible.builtin.set_fact:
        db_patch_available: >-
          {{
            db_updates.results
            | selectattr('db_home_patches', 'defined')
            | map(attribute='db_home_patches')
            | flatten
            | selectattr('version', 'equalto', db_patch_version)
            | list
            | length > 0
          }}

    - name: Display DB patch availability
      ansible.builtin.debug:
        msg:
          - "Configured DB patch version: {{ db_patch_version }}"
          - "DB patch available in OCI: {{ db_patch_available }}"

